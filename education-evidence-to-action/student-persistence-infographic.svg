<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Understanding student persistence: illustrative part-time 64 percent and full-time 76 percent</title><desc id="desc">An independently created infographic using fictional synthetic examples. The full-time group shows a 76 percent persistence rate, versus 64 percent for the part-time group, a descriptive difference of 12 percentage points. The comparison does not show that enrollment intensity causes persistence or that any intervention is effective.</desc>
